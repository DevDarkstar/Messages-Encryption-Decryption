name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        preset:
          - x64-debug
          - x64-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Install Release
        if: matrix.preset == 'x64-release'
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --install out/build/x64-release --prefix out/package

      - name: Create ZIP
        if: matrix.preset == 'x64-release'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "out/package/*" `
            -DestinationPath "Solitaire-Windows-x64.zip" `
            -Force

      - name: Upload Release Package
        if: matrix.preset == 'x64-release'
        uses: actions/upload-artifact@v4
        with:
          name: Solitaire-Windows-x64
          path: Solitaire-Windows-x64.zip
